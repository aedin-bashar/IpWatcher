name: CD (Deploy to Home Server)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ipwatcher-deploy
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4

      - name: Publish (self-contained win-x64)
        run: >
          dotnet publish .\IpWatcher.Worker\IpWatcher.Worker.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o .\_publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipwatcher-worker
          path: .\_publish\

  deploy:
    needs: publish
    runs-on: self-hosted
    # Make sure your server runner has this label:
    # (Repo Settings -> Actions -> Runners -> your runner -> Labels)
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ipwatcher-worker
          path: .\_publish

      - name: Deploy
        shell: pwsh
        run: .\_publish\deploy.ps1