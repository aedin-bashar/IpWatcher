name: Build-Test-Deploy (Home Server)

on:
  pull_request:
  push:
    branches: [ "master" ]
  workflow_dispatch:

concurrency:
  group: ipwatcher-deploy
  cancel-in-progress: true

jobs:
  build_test_publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Publish (win-x64, self-contained)
        run: >
          dotnet publish .\IpWatcher.Worker\IpWatcher.Worker.csproj
          -c Release -r win-x64 --self-contained true
          -o .\_publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipwatcher-worker
          path: .\_publish\

  deploy_to_server:
    needs: build_test_publish
    runs-on: self-hosted
    environment: production
    if: github.event_name != 'pull_request'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ipwatcher-worker
          path: .\_publish

      - name: Stop service (if exists)
        shell: powershell
        run: |
          $serviceName = "IpWatcher.Worker"
          $svc = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
          if ($null -ne $svc -and $svc.Status -ne "Stopped") {
            Stop-Service -Name $serviceName -Force
            Start-Sleep -Seconds 2
          }

      - name: Copy files to C:\Services\IpWatcher\app (keep Production config)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $installDir = "C:\Services\IpWatcher\app"
          $publishDir = (Resolve-Path ".\_publish").Path

          if (!(Test-Path $installDir)) { New-Item -ItemType Directory -Force -Path $installDir | Out-Null }

          robocopy "$publishDir" "$installDir" /E /R:2 /W:2 /XF appsettings.json appsettings.*.json
          $rc = $LASTEXITCODE

          if ($rc -le 7) {
            Write-Host "Robocopy succeeded with exit code $rc"
            exit 0
          }

          throw "Robocopy failed with exit code $rc"

      - name: Generate appsettings.json (production)
        shell: powershell
        env:
          EMAIL_HOST: ${{ vars.EMAIL_HOST }}
          EMAIL_PORT: ${{ vars.EMAIL_PORT }}
          EMAIL_USESSL: ${{ vars.EMAIL_USESSL }}
          EMAIL_USERNAME: ${{ vars.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
          EMAIL_SUBJECT_PREFIX: ${{ vars.EMAIL_SUBJECT_PREFIX }}
          IPIFY_BASEURL: ${{ vars.IPIFY_BASEURL }}
          INTERVAL_MINUTES: ${{ vars.INTERVAL_MINUTES }}
        run: |
          $ErrorActionPreference = "Stop"

          $path = "C:\Services\IpWatcher\app\appsettings.json"

          foreach ($required in @(
            "EMAIL_HOST",
            "EMAIL_PORT",
            "EMAIL_USESSL",
            "EMAIL_USERNAME",
            "EMAIL_PASSWORD",
            "EMAIL_FROM",
            "EMAIL_TO",
            "IPIFY_BASEURL",
            "INTERVAL_MINUTES"
          )) {
            $value = [Environment]::GetEnvironmentVariable($required)
            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "Missing required environment value: $required. Check GitHub Environment variables/secrets (environment: production)."
            }
          }

          if ([string]::IsNullOrWhiteSpace($env:EMAIL_SUBJECT_PREFIX)) {
            $env:EMAIL_SUBJECT_PREFIX = "[IpWatcher]"
          }

          $config = @{
            Ipify = @{
              BaseUrl = $env:IPIFY_BASEURL
            }
            ConnectionStrings = @{
              IpWatcher = "Data Source=C:\\Services\\IpWatcher\\data\\ipwatcher.sqlite"
            }
            Email = @{
              Host = $env:EMAIL_HOST
              Port = [int]$env:EMAIL_PORT
              UseSsl = [bool]::Parse($env:EMAIL_USESSL)
              UserName = $env:EMAIL_USERNAME
              Password = $env:EMAIL_PASSWORD
              From = $env:EMAIL_FROM
              To = $env:EMAIL_TO
              SubjectPrefix = $env:EMAIL_SUBJECT_PREFIX
            }
            Jobs = @{
              CheckIpChange = @{
                IntervalMinutes = [int]$env:INTERVAL_MINUTES
              }
            }
            Logging = @{
              LogLevel = @{
                Default = "Information"
                "Microsoft.Hosting.Lifetime" = "Information"
              }
            }
            Serilog = @{
              MinimumLevel = @{
                Default = "Information"
                Override = @{
                  Microsoft = "Warning"
                  "Microsoft.Hosting.Lifetime" = "Information"
                  System = "Warning"
                }
              }
              Enrich = @("FromLogContext")
              Properties = @{
                Application = "IpWatcher.Worker"
              }
            }
          }

          $json = $config | ConvertTo-Json -Depth 10
          Set-Content -Path $path -Value $json -Encoding UTF8
          Write-Host "Wrote $path"

      - name: Start service
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $serviceName = "IpWatcher.Worker"

          $svc = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
          if ($null -eq $svc) {
            throw "Service '$serviceName' is not installed. Install it once on the server using sc.exe create."
          }

          sc.exe start $serviceName
          Start-Sleep -Seconds 2
          sc.exe query $serviceName
