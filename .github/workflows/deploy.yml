name: Build-Test-Deploy (Home Server)

on:
  pull_request:
  push:
    branches: [ "master" ]
  workflow_dispatch:

concurrency:
  group: ipwatcher-deploy
  cancel-in-progress: true

jobs:
  build_test_publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Publish (win-x64, self-contained)
        run: >
          dotnet publish .\IpWatcher.Worker\IpWatcher.Worker.csproj
          -c Release -r win-x64 --self-contained true
          -o .\_publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipwatcher-worker
          path: .\_publish\

  deploy_to_server:
    needs: build_test_publish
    runs-on: self-hosted
    if: github.event_name != 'pull_request'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ipwatcher-worker
          path: .\_publish

      - name: Stop service (if exists)
        shell: powershell
        run: |
          $serviceName = "IpWatcher.Worker"
          $svc = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
          if ($null -ne $svc -and $svc.Status -ne "Stopped") {
            Stop-Service -Name $serviceName -Force
            Start-Sleep -Seconds 2
          }

      - name: Copy files to C:\Services\IpWatcher\app (keep Production config)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $installDir = "C:\Services\IpWatcher\app"
          $publishDir = (Resolve-Path ".\_publish").Path

          if (!(Test-Path $installDir)) { New-Item -ItemType Directory -Force -Path $installDir | Out-Null }

          robocopy "$publishDir" "$installDir" /E /R:2 /W:2 /XF appsettings.json appsettings.*.json
          $rc = $LASTEXITCODE

          if ($rc -le 7) {
            Write-Host "Robocopy succeeded with exit code $rc"
            exit 0
          }

          throw "Robocopy failed with exit code $rc"

      - name: Install service if missing, then start it
        shell: powershell
        run: |
          $serviceName = "IpWatcher.Worker"
          $exePath = "C:\Services\IpWatcher\app\IpWatcher.Worker.exe"

          $svc = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
          if ($null -eq $svc) {
            sc.exe create $serviceName binPath= "`"$exePath`"" start= auto
          }

          sc.exe start $serviceName
          Start-Sleep -Seconds 2
          sc.exe query $serviceName

      - name: Start service
        shell: powershell
        run: |
          $serviceName = "IpWatcher.Worker"

          $svc = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
          if ($null -eq $svc) {
            throw "Service '$serviceName' is not installed. Install it once on the server using sc.exe create."
          }

          sc.exe start $serviceName
          Start-Sleep -Seconds 2
          sc.exe query $serviceName

      - name: Configure service environment variables (Email secrets)
        shell: powershell
        env:
          IPWATCHER_EMAIL_USERNAME: ${{ secrets.IPWATCHER_EMAIL_USERNAME }}
          IPWATCHER_EMAIL_PASSWORD: ${{ secrets.IPWATCHER_EMAIL_PASSWORD }}
          IPWATCHER_EMAIL_FROM: ${{ secrets.IPWATCHER_EMAIL_FROM }}
          IPWATCHER_EMAIL_TO: ${{ secrets.IPWATCHER_EMAIL_TO }}
        run: |
          $ErrorActionPreference = "Stop"
          $serviceName = "IpWatcher.Worker"
          $regPath = "HKLM:\SYSTEM\CurrentControlSet\Services\$serviceName"

          if (-not (Test-Path $regPath)) {
            throw "Service registry key not found: $regPath. Install the service first."
          }

          $envValues = @(
            "Email__UserName=$env:IPWATCHER_EMAIL_USERNAME",
            "Email__Password=$env:IPWATCHER_EMAIL_PASSWORD",
            "Email__From=$env:IPWATCHER_EMAIL_FROM",
            "Email__To=$env:IPWATCHER_EMAIL_TO",
            "DOTNET_ENVIRONMENT=Production"
          )

          New-ItemProperty -Path $regPath -Name Environment -PropertyType MultiString -Value $envValues -Force | Out-Null

          sc.exe stop $serviceName | Out-Null
          Start-Sleep -Seconds 2
          sc.exe start $serviceName | Out-Null
          sc.exe query $serviceName
